# Publishes a GitHub release when a version tag is pushed:  git tag v1.0.0 && git push origin v1.0.0
# It contains the game for Windows and Linux and the WebGL build.
# Running it by hand (Actions > Release > Run workflow) builds everything without publishing.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_PATH: UnityProject
  BUILD_NAME: HorrorProject

jobs:
  game:
    name: Game ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        targetPlatform: [StandaloneWindows64, StandaloneLinux64, WebGL]
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
      - name: Add swap space
        run: |
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('UnityProject/Assets/**', 'UnityProject/Packages/**', 'UnityProject/ProjectSettings/**') }}
          restore-keys: Library-${{ matrix.targetPlatform }}-
      # The editor is occasionally killed while starting (exit code 137); one retry absorbs it.
      - uses: game-ci/unity-builder@v4
        id: build
        continue-on-error: true
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: ${{ env.BUILD_NAME }}
          versioning: ${{ startsWith(github.ref, 'refs/tags/') && 'Tag' || 'None' }}
      - uses: game-ci/unity-builder@v4
        if: steps.build.outcome == 'failure'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: ${{ env.BUILD_NAME }}
          versioning: ${{ startsWith(github.ref, 'refs/tags/') && 'Tag' || 'None' }}
      - name: Zip
        run: |
          sudo chown -R "$(id -u):$(id -g)" build
          cd build/${{ matrix.targetPlatform }}
          zip -qr "$GITHUB_WORKSPACE/${{ env.BUILD_NAME }}-${{ matrix.targetPlatform }}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.targetPlatform }}
          path: ${{ env.BUILD_NAME }}-${{ matrix.targetPlatform }}.zip

  publish:
    name: Publish release
    needs: game
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            **Horror Project** - first-person horror prototype made in Unity.

            - `HorrorProject-StandaloneWindows64.zip`: unzip and run `HorrorProject.exe`.
            - `HorrorProject-StandaloneLinux64.zip`: unzip and run `./HorrorProject`.
            - `HorrorProject-WebGL.zip`: browser build (also playable on the project's GitHub Pages).
